nelmio_cors:
    defaults:
        allow_origin: ['http://192.168.1.129', "http://localhost:3000"]  
        allow_credentials: true
        allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        allow_headers: ["Content-Type", "Authorization"]
        expose_headers: ["Link"]
        max_age: 3600
        hosts: []
        origin_regex: false
    paths:
        "^/api/":  
            allow_origin: ["http://localhost:3000"]
            allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allow_headers: ["Content-Type", "Authorization"]
            max_age: 3600
